<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061d13">
  <title>VEEDU | Page not found</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page{min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px;background:radial-gradient(circle at 50% 30%,#103a26 0,#061d13 60%,#04150e 100%)}
    .error-page main{max-width:700px}
    .error-mark{font:500 72px/1 'Cormorant Garamond',Georgia,serif;color:#d8ad3d;margin-bottom:18px}
    .error-page h1{font:500 clamp(48px,7vw,82px)/.9 'Cormorant Garamond',Georgia,serif;color:#f4f0e4;margin:0 0 22px}
    .error-page h1 em{font-style:italic;color:#ecd88d}
    .error-page main>p:not(.eyebrow){color:#b6bcae;margin:0 auto 32px}
  </style>
</head>
<body class="error-page">
  <main>
    <div class="error-mark">വീട്</div>
    <p class="eyebrow">VEEDU · Modern Kerala Cuisine</p>
    <h1>That page has wandered<br><em>off the table.</em></h1>
    <p>The page you were looking for could not be found.</p>
    <a class="button button-gold" href="/">Return to VEEDU</a>
  </main>
</body>
</html>
